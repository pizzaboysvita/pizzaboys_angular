<div class="accordion font-family" id="accordionExample">

    <div class="accordion-item">
        <h2 class="accordion-header" id="headingOne">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne"
            aria-expanded="true" aria-controls="collapseOne">
            <strong class="font-family">Search Criteria</strong>
            </button>
        </h2>
        <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne"
        data-bs-parent="#accordionExample">
        <div class="accordion-body">
            <form [formGroup]="SheetForm">
                <div class="row">
                    <div class="col-xl-3">
                        <div class="media-cell mt-1">
                  <h6 class="fw-bold">Store Names <span class="text-danger">*</span></h6>

                  <ng-select [items]="storesList" bindLabel="store_name" bindValue="store_id" formControlName="store_id"
                    [clearable]="true" [searchable]="false" (change)="onStoreChange($event)">
                  </ng-select>

                  <div *ngIf="SheetForm.get('store_id')?.touched &&
             SheetForm.get('store_id')?.invalid" class="text-danger">
                    Store ID is required
                  </div>
                </div>
                    </div>
                <div class="row align-items-end">
                <div class="d-flex gap-3 align-items-end h-100">
                  <button class="btn btn-animation save-button" type="button" (click)="search()">
                    <i class="ri-search-line"></i>&nbsp; Search
                  </button>

                  <button class="btn btn-animation reset-button" type="button" (click)="reset()">
                    <i class="ri-loop-right-line"></i>&nbsp; Reset
                  </button>
                </div>
              </div>
                </div>
            </form>
        </div>
    </div>
</div>
<br>


<div class="row font-family">
    <div class="col-sm-12">
        <app-card [cardClass]="'card-table'" [body]="true">
            <div class="title-header option-title d-sm-flex d-block" body>
                <h5>Time Sheet List</h5>
                <div class="right-options">
                    <ul>
                        <li><span style="font-size: 14px;color: #787c8b;font-weight: 600 ;">No.of.records:{{sheetList.length}}</span></li>
                        
                    </ul>
                </div>
            </div>
            

            <div body>
                <div style="overflow: auto;">
                    <ag-grid-angular class="ag-theme-alpine font-family" style="width: 100%;" [columnDefs]="columnDefs"
                    [rowData]="sheetList" [domLayout]="'autoHeight'" [pagination]="true" [paginationPageSize]="10"
                    [paginationPageSizeSelector]="[10,20,50,100]"
                    [gridOptions]="gridOptions" [suppressColumnVirtualisation]="true"
                    [defaultColDef]="{ flex: 1, minWidth: 100, sortable: true }"  (cellClicked)="onCellClicked($event)">
                    </ag-grid-angular>
                </div>
            </div>

        </app-card>
    </div>
</div>

<ng-template #confirmModal let-modal>
    <div class="modal-content">
        <div class="modal-header d-block text-center">
            <h5 class="modal-title w-100" style="font-size: 20px; font-weight: 600;">Confirm Deletion</h5>
            <button type="button" class="btn-close" (click)="modal.dismiss()">     </button>
        </div>

        <div class="modal-body">
            <div class="text-center">
                <span style="font-size: 16px;">
                    Are you sure you want to delete store <strong>{{storeData.store_name}}</strong>?
                </span>
                <span class="text-danger fw-bold">This action cannot be undone.</span>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-sm fw-bold btn-animation" (click)="modal.dismiss()">No</button>
            <button type="button" class="btn btn-sm fw-bold btn-animation" (click)="onConfirm(modal)">Yes</button>
        </div>
    </div>
</ng-template>
